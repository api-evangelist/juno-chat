tools:
- name: find_symptom_words
  description: After explicit consent, organise only the user's non-identifying description into neutral sensation, timing,
    pattern, and impact vocabulary. Do not accept PHI or infer a diagnosis or cause.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  inputSchema:
    type: object
    $schema: https://json-schema.org/draft/2020-12/schema
    properties:
      consentConfirmed:
        type: boolean
        const: true
        description: Set to true only after the user explicitly agrees to transient processing of their non-identifying, user-authored
          health notes. Do not submit PHI, medical-record identifiers, contact details, credentials, or provider documents.
      description:
        type: string
        maxLength: 2000
      bodyArea:
        type: string
        maxLength: 2000
      timing:
        type: string
        maxLength: 2000
      impact:
        type: string
        maxLength: 2000
    required:
    - consentConfirmed
    - description
- name: build_health_timeline
  description: After explicit consent, sort only non-identifying, user-authored observations into a factual chronology while
    preserving uncertainty. Do not accept PHI or invent dates or diagnoses.
  annotations:
