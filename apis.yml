aid: juno-chat
name: Juno Chat
description: >-
  Juno (junocompanion.com), operated by SharedGenes, Inc., is a Y Combinator-backed
  (P26) consumer digital-health startup building an AI personal health assistant for
  the 1B+ people living with chronic illness. The Juno mobile app (iOS and Android)
  builds a longitudinal health profile through conversation, biometrics, and medical
  history to deliver personalized symptom guidance, automated symptom tracking by text
  or voice, trigger-pattern identification, and appointment-ready reports for clinicians.
  It supports conditions including fibromyalgia, long COVID, POTS, ME/CFS, EDS,
  endometriosis, lupus, and MS, and is informed by research from Oxford and UCL plus
  1,000+ patient interviews. Founded in 2025 by Marshall Gould (CEO) and Isaac Tolley
  (CTO); HIPAA-aligned infrastructure with no health data sold. Juno is a consumer app
  and does not currently publish a public developer API, SDKs, or API documentation.
