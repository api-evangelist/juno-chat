apis:
- aid: juno-chat:juno-open-health-tools-mcp-server
  name: Juno Open Health Tools MCP Server
  description: Remote streamable-HTTP MCP server (serverInfo Juno Health Tools 1.1.0) with five read-only, consent-gated tools
    (find_symptom_words, build_health_timeline, prepare_appointment_brief, reflect_on_flare, render_appointment_brief) that organise a user's
    non-identifying health notes into symptom vocabulary, timelines, flare reflections and an appointment brief, plus one UI resource for the
    rendered brief. Each call requires consentConfirmed true; the server declines PHI and does not diagnose. No credentials required. Listed in
    the official MCP Registry as io.github.MarshallBear1/juno-open-health-tools; MIT-licensed source on GitHub.
  humanURL: https://github.com/MarshallBear1/juno-open-health-tools
