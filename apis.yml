aid: juno-chat
name: Juno
description: >-
  Juno, operated by SharedGenes, Inc., is a Y Combinator-backed consumer mobile app
  for people living with chronic and invisible illnesses. Available on iOS and Android,
  it offers text and voice conversations, health-diary and symptom logging, pattern
  tracking, and gentle check-ins. Juno also publishes Juno Open Health Tools, an
  open-source set of privacy-conscious appointment-preparation and symptom-diary
  resources. Its public, read-only Model Context Protocol server exposes five
  consent-gated tools for organizing user-provided notes. The tools do not diagnose,
  recommend treatment, or replace a clinician.
